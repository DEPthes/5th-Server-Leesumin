<!DOCTYPE html>
<html>
    <head>
        <title>static content</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    </head>
    <body>
        <h1>Static Content</h1>
        <p>정적컨텐츠 입니다.
            * 정적 컨텐츠는 웹 브라우저에서 요청하는 URL과 일치하는 파일이 존재하면, 해당 파일을 그대로 반환하는 방식으로 동작합니다.
            1. 컨트롤러가 존재하면 일치하는 파일을 반환하고,
            없어더라도 URL과 일치하는 파일이 존재하면 해당 파일을 반환합니다.
        </p>
    </body>
</html>
